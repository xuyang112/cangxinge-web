[tool.poetry]
name = "mydaily-api"
version = "0.1.0"
description = "个人记录 SaaS 后端服务：日记 / 学习资料 / 生活动态"
authors = ["mydaily"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115,<1.0"
uvicorn = { version = ">=0.32,<1.0", extras = ["standard"] }
sqlalchemy = ">=2.0.36,<2.1"
asyncpg = ">=0.30,<0.31"
psycopg = { version = ">=3.2,<4.0", extras = ["binary"] }
alembic = ">=1.14,<2.0"
pydantic = ">=2.9,<3.0"
pydantic-settings = ">=2.6,<3.0"
python-multipart = ">=0.0.12,<0.1"
PyJWT = ">=2.10,<3.0"
bcrypt = ">=4.2,<5.0"
boto3 = ">=1.35,<2.0"
email-validator = ">=2.2,<3.0"

[tool.poetry.group.dev.dependencies]
aiosqlite = ">=0.20,<0.21"
pytest = ">=8.3,<9.0"
pytest-asyncio = ">=0.24,<1.0"
httpx = ">=0.27,<1.0"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"
